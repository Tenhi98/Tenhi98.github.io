<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2a33">
<title>SiteSnap 工地巡查</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<!--SITESNAP:BODY-START-->
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--hivis)"/><path d="M7 12.5h4.5l1.6-3h5.8l1.6 3H25v11H7z" fill="none" stroke="var(--ink-on-hivis)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="18" r="3.3" fill="none" stroke="var(--ink-on-hivis)" stroke-width="2.2"/></svg>
      <span class="brand-name">SiteSnap</span>
    </div>
    <div class="topbar-tools">
      <span id="save-state" class="save-state" role="status" data-t="save.ready"></span>
      <button type="button" id="lang" class="ghost small">English</button>
      <button type="button" id="open-data" class="ghost small" data-t="nav.data"></button>
    </div>
  </header>

  <div class="layout">
    <!-- 巡查清單：每次巡查一份獨立記錄 -->
    <aside class="inspections" aria-labelledby="insp-title">
      <div class="panel-head">
        <h2 id="insp-title" data-t="insp.title"></h2>
        <button type="button" id="new-insp" class="small" data-t="insp.new"></button>
      </div>
      <ul id="insp-list" class="insp-list"></ul>
      <p class="hint" data-t="insp.hint"></p>
    </aside>

    <main id="workspace" class="workspace">
      <section class="details" aria-labelledby="details-title">
        <div class="panel-head">
          <h2 id="details-title" data-t="details.title"></h2>
          <div class="head-actions">
            <button type="button" id="ai-settings" class="ghost small" data-t="ai.settings"></button>
            <button type="button" id="open-report" class="primary small" data-t="report.open"></button>
          </div>
        </div>
        <div class="grid4">
          <label><span data-t="f.project"></span><input id="f-project" maxlength="120" data-t-ph="f.project.ph"></label>
          <label><span data-t="f.site"></span><input id="f-site" maxlength="160" data-t-ph="f.site.ph"></label>
          <label><span data-t="f.date"></span><input id="f-date" type="date"></label>
          <label><span data-t="f.author"></span><input id="f-author" maxlength="80" data-t-ph="f.author.ph"></label>
        </div>
      </section>

      <div class="board">
        <section class="strip" aria-labelledby="strip-title">
          <div class="panel-head">
            <h2 id="strip-title"><span data-t="strip.title"></span> <span id="photo-count" class="count">0</span></h2>
            <span id="review-progress" class="progress"></span>
          </div>
          <div class="row">
            <button type="button" id="take" class="primary grow" data-t="strip.take"></button>
            <button type="button" id="pick" class="grow" data-t="strip.pick"></button>
          </div>
          <input type="file" id="in-camera" accept="image/*" capture="environment" hidden>
          <input type="file" id="in-files" accept="image/*" multiple hidden>
          <div id="drop" class="drop" data-t="strip.drop"></div>
          <ol id="photo-list" class="photo-list"></ol>
        </section>

        <section class="editor" aria-labelledby="editor-title">
          <h2 id="editor-title" class="sr-only" data-t="editor.title"></h2>
          <div id="empty" class="empty">
            <svg viewBox="0 0 160 90" width="160" aria-hidden="true"><g fill="none" stroke="var(--line-strong)" stroke-width="2"><path d="M6 80h148M24 80V40h30v40M30 50h6m6 0h6M30 60h6m6 0h6M70 80V22h8v58M60 22l40-12 30 12H60m20-12v12m42 0v18"/><path d="M118 40a4 4 0 1 0 8 0" stroke="var(--hivis-strong)"/></g></svg>
            <h3 data-t="empty.title"></h3>
            <p data-t="empty.body"></p>
          </div>

          <div id="entry" class="entry" hidden>
            <figure class="photo-frame">
              <img id="photo" alt="">
              <figcaption>
                <span id="photo-meta" class="meta"></span>
                <span class="row tight">
                  <button type="button" id="move-up" class="icon" data-t-aria="photo.up">↑</button>
                  <button type="button" id="move-down" class="icon" data-t-aria="photo.down">↓</button>
                  <button type="button" id="remove" class="ghost small danger-text" data-t="photo.remove"></button>
                </span>
              </figcaption>
            </figure>

            <div class="grid3">
              <label><span data-t="p.location"></span><input id="p-location" maxlength="160" data-t-ph="p.location.ph"></label>
              <label><span data-t="p.category"></span><select id="p-category"></select></label>
              <fieldset class="priority">
                <legend data-t="p.priority"></legend>
                <div class="seg" id="p-priority"></div>
              </fieldset>
            </div>
            <label><span data-t="p.note"></span><textarea id="p-note" maxlength="2400" rows="4" data-t-ph="p.note.ph"></textarea></label>
            <label><span data-t="p.action"></span><textarea id="p-action" maxlength="1400" rows="3" data-t-ph="p.action.ph"></textarea></label>

            <div id="draft" class="draft" hidden>
              <strong data-t="ai.draft"></strong>
              <p id="draft-text"></p>
              <div class="row">
                <button type="button" id="draft-adopt" class="small" data-t="ai.adopt"></button>
                <button type="button" id="draft-drop" class="ghost small" data-t="ai.discard"></button>
              </div>
            </div>

            <div class="row end">
              <button type="button" id="analyse" class="ghost" data-t="ai.analyse"></button>
              <button type="button" id="review" class="primary"></button>
            </div>
            <p id="review-note" class="review-note"></p>
          </div>
        </section>
      </div>
    </main>
  </div>
  <p id="toast" class="toast" role="status" hidden></p>
</div>

<!-- 通用確認框（不用瀏覽器 confirm，避免被內嵌環境封鎖） -->
<dialog id="ask" class="dlg narrow">
  <p id="ask-text"></p>
  <div class="row end">
    <button type="button" id="ask-no" data-t="common.cancel"></button>
    <button type="button" id="ask-yes" class="primary"></button>
  </div>
</dialog>

<dialog id="data" class="dlg" aria-labelledby="data-title">
  <h2 id="data-title" data-t="data.title"></h2>
  <dl class="facts">
    <div><dt data-t="data.usage"></dt><dd id="data-usage">—</dd></div>
    <div><dt data-t="data.persist"></dt><dd id="data-persist">—</dd></div>
    <div><dt data-t="data.lastExport"></dt><dd id="data-last">—</dd></div>
  </dl>
  <p class="hint" data-t="data.body"></p>
  <div class="row wrap">
    <button type="button" id="export" class="primary" data-t="data.export"></button>
    <button type="button" id="import" data-t="data.import"></button>
    <button type="button" id="delete-insp" class="ghost danger-text" data-t="data.delete"></button>
  </div>
  <input type="file" id="in-backup" accept=".json,application/json" hidden>
  <div class="row end"><button type="button" class="close-dlg" data-t="common.done"></button></div>
</dialog>

<dialog id="ai" class="dlg" aria-labelledby="ai-title">
  <h2 id="ai-title" data-t="ai.settings"></h2>
  <p class="hint" data-t="ai.direct"></p>
  <label><span data-t="ai.provider"></span><select id="ai-provider"></select></label>
  <div id="ai-fields" class="ai-fields" hidden>
    <label id="ai-region-wrap" hidden><span data-t="ai.region"></span><select id="ai-region"></select></label>
    <label><span class="label-row"><span data-t="ai.endpoint"></span><button type="button" id="ai-reset-url" class="link" data-t="ai.resetUrl"></button></span><input id="ai-endpoint" type="url" spellcheck="false"></label>
    <label><span data-t="ai.model"></span><input id="ai-model" list="ai-models" spellcheck="false" autocomplete="off"><datalist id="ai-models"></datalist></label>
    <p id="ai-model-hint" class="hint"></p>
    <label><span>API Key</span><input id="ai-key" type="password" autocomplete="off" spellcheck="false"></label>
    <p class="hint" data-t="ai.keyNote"></p>
  </div>
  <label><span data-t="ai.depth"></span>
    <select id="ai-depth">
      <option value="0" data-t="ai.depth0"></option>
      <option value="1" data-t="ai.depth1" selected></option>
      <option value="2" data-t="ai.depth2"></option>
    </select>
  </label>
  <p id="ai-route" class="hint"></p>
  <div class="row end"><button type="button" class="close-dlg primary" data-t="common.done"></button></div>
</dialog>

<dialog id="consent" class="dlg" aria-labelledby="consent-title">
  <h2 id="consent-title" data-t="ai.consentTitle"></h2>
  <img id="consent-img" alt="" class="consent-img">
  <p id="consent-dest" class="meta"></p>
  <p data-t="ai.consentBody"></p>
  <div class="row end">
    <button type="button" class="close-dlg" data-t="common.cancel"></button>
    <button type="button" id="consent-send" class="primary" data-t="ai.send"></button>
  </div>
</dialog>

<dialog id="report" class="report-dlg" aria-labelledby="report-bar-title">
  <div class="report-bar">
    <strong id="report-bar-title" data-t="report.title"></strong>
    <label class="inline"><input type="checkbox" id="report-compact"> <span data-t="report.compact"></span></label>
    <span class="grow"></span>
    <button type="button" class="close-dlg" data-t="report.back"></button>
    <button type="button" id="report-print" class="primary" data-t="report.print"></button>
  </div>
  <div id="report-pages" class="report-pages"></div>
</dialog>
<!--SITESNAP:BODY-END-->

<script src="i18n.js?v=1"></script>
<script src="store.js?v=1"></script>
<script src="app.js?v=1"></script>
<script src="ai.js?v=1"></script>
</body>
</html>
